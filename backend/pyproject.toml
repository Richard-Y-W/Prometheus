[project]
name = "prometheus-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.9,<1",
    "psycopg[binary]>=3.2,<4",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
