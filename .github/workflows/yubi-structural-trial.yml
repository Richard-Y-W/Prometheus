name: YUBI structural trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-yubi-pair:
    name: Windows reviewed YUBI pair
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Keep repository evidence bytes on LF
        run: git config --global core.autocrlf input
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the bounded UCRT64 solver toolchain
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          location: C:\msys64
          msystem: UCRT64
          release: false
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-calculix-ccx
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
      - name: Execute and replay the reviewed pair
        shell: pwsh
        run: .\scripts\run-yubi-structural-slice.ps1
      - name: Retain exact YUBI solver evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yubi-structural-trial-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/validation/yubi-bracket
          if-no-files-found: error
          retention-days: 14
